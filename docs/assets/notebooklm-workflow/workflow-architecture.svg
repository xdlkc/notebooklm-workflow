<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-label="NotebookLM workflow architecture">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.sub{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}.label{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.small{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}.tiny{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.box{rx:18;stroke-width:2}.lane{fill:rgba(15,23,42,.78);stroke:#334155;stroke-width:1.5;rx:24}.arrow{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow);filter:url(#glow)}
    </style>
  </defs>
  <rect width="1440" height="880" fill="url(#bg)"/>
  <path d="M0 80 H1440 M0 160 H1440 M0 240 H1440 M0 320 H1440 M0 400 H1440 M0 480 H1440 M0 560 H1440 M0 640 H1440 M0 720 H1440 M0 800 H1440 M120 0 V880 M240 0 V880 M360 0 V880 M480 0 V880 M600 0 V880 M720 0 V880 M840 0 V880 M960 0 V880 M1080 0 V880 M1200 0 V880 M1320 0 V880" stroke="#1e293b" stroke-width="1" opacity=".55"/>
  <text x="70" y="68" class="title">NotebookLM Workflow：从来源到可复用 Demo 的技能编排</text>
  <text x="70" y="103" class="sub">Hermes skills 不只是命令清单，而是一条带审计、生成、交付和展示层的流水线。</text>
  <rect x="60" y="150" width="240" height="620" class="lane"/><rect x="330" y="150" width="250" height="620" class="lane"/><rect x="610" y="150" width="250" height="620" class="lane"/><rect x="890" y="150" width="230" height="620" class="lane"/><rect x="1150" y="150" width="230" height="620" class="lane"/>
  <text x="90" y="190" class="label">1. Source</text><text x="360" y="190" class="label">2. Notebook</text><text x="640" y="190" class="label">3. Studio</text><text x="920" y="190" class="label">4. QA</text><text x="1180" y="190" class="label">5. Delivery</text>
  <g transform="translate(90 230)"><rect width="180" height="92" fill="rgba(120,53,15,.35)" stroke="#f59e0b" class="box"/><text x="22" y="34" class="label">PDF / EPUB</text><text x="22" y="62" class="small">合法来源文件</text></g>
  <g transform="translate(90 360)"><rect width="180" height="92" fill="rgba(30,41,59,.65)" stroke="#94a3b8" class="box"/><text x="22" y="34" class="label">URL / Blog</text><text x="22" y="62" class="small">网页与站点地图</text></g>
  <g transform="translate(90 490)"><rect width="180" height="92" fill="rgba(76,29,149,.35)" stroke="#a78bfa" class="box"/><text x="22" y="34" class="label">zlib / Calibre</text><text x="22" y="62" class="small">可选来源准备</text></g>
  <g transform="translate(365 255)"><rect width="180" height="110" fill="rgba(8,51,68,.45)" stroke="#22d3ee" class="box"/><text x="22" y="34" class="label">notebooklm</text><text x="22" y="62" class="small">create / add source</text><text x="22" y="86" class="small">wait until ready</text></g>
  <g transform="translate(365 440)"><rect width="180" height="120" fill="rgba(6,78,59,.38)" stroke="#34d399" class="box"/><text x="22" y="34" class="label">Prompt Plan</text><text x="22" y="62" class="small">artifact-specific</text><text x="22" y="86" class="small">Chinese + grounded</text></g>
  <g transform="translate(645 235)"><rect width="180" height="92" fill="rgba(14,116,144,.35)" stroke="#22d3ee" class="box"/><text x="22" y="34" class="label">PPT / Report</text><text x="22" y="62" class="small">详细版读书分享</text></g>
  <g transform="translate(645 360)"><rect width="180" height="92" fill="rgba(67,56,202,.35)" stroke="#818cf8" class="box"/><text x="22" y="34" class="label">Map / Table</text><text x="22" y="62" class="small">结构化复用</text></g>
  <g transform="translate(645 485)"><rect width="180" height="92" fill="rgba(190,24,93,.30)" stroke="#f472b6" class="box"/><text x="22" y="34" class="label">Audio / Video</text><text x="22" y="62" class="small">长任务产物</text></g>
  <g transform="translate(925 255)"><rect width="160" height="110" fill="rgba(120,53,15,.30)" stroke="#fbbf24" class="box"/><text x="20" y="34" class="label">Audit Trail</text><text x="20" y="62" class="small">00-16 markdown</text><text x="20" y="86" class="small">facts &amp; QA</text></g>
  <g transform="translate(925 440)"><rect width="160" height="120" fill="rgba(136,19,55,.35)" stroke="#fb7185" class="box"/><text x="20" y="34" class="label">Validation</text><text x="20" y="62" class="small">PPTX / links</text><text x="20" y="86" class="small">secret scan</text></g>
  <g transform="translate(1180 225)"><rect width="170" height="96" fill="rgba(6,78,59,.38)" stroke="#34d399" class="box"/><text x="20" y="34" class="label">Google Drive</text><text x="20" y="62" class="small">原始大文件</text></g>
  <g transform="translate(1180 360)"><rect width="170" height="96" fill="rgba(8,51,68,.45)" stroke="#22d3ee" class="box"/><text x="20" y="34" class="label">Repo Demo</text><text x="20" y="62" class="small">压缩版 + manifest</text></g>
  <g transform="translate(1180 495)"><rect width="170" height="96" fill="rgba(76,29,149,.35)" stroke="#a78bfa" class="box"/><text x="20" y="34" class="label">README</text><text x="20" y="62" class="small">图文预览</text></g>
  <path class="arrow" d="M270 276 C315 276 315 310 365 310"/><path class="arrow" d="M270 406 C315 406 315 310 365 310"/><path class="arrow" d="M270 536 C315 536 315 500 365 500"/><path class="arrow" d="M545 310 C590 310 590 280 645 280"/><path class="arrow" d="M545 500 C590 500 590 405 645 405"/><path class="arrow" d="M825 280 C875 280 875 310 925 310"/><path class="arrow" d="M825 530 C875 530 875 500 925 500"/><path class="arrow" d="M1085 310 C1135 310 1135 273 1180 273"/><path class="arrow" d="M1085 500 C1135 500 1135 408 1180 408"/><path class="arrow" d="M1085 500 C1135 500 1135 543 1180 543"/>
  <rect x="78" y="705" width="1280" height="42" rx="14" fill="rgba(2,6,23,.65)" stroke="#334155"/><text x="100" y="731" class="tiny">Non-negotiables: no source book in git · no auth/session/cookie/token · no unsupported claims · original large binaries stay in Drive · README gets compressed previews only</text>
</svg>