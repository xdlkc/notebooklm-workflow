<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Remotion storyboard">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><style>.title{font:800 36px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.sub{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c7d2fe}.time{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fde68a}.h{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.p{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbeafe}.box{rx:20;fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.22);stroke-width:1.5}</style></defs>
  <rect width="1440" height="820" fill="url(#bg)"/><text x="70" y="72" class="title">Remotion Teaser Storyboard：60 秒解释这个 workflow</text><text x="70" y="108" class="sub">文章可以静态阅读；Remotion 分镜则把同一套流程变成动态传播素材。</text>
  <g transform="translate(70 170)"><rect width="210" height="460" class="box"/><text x="28" y="45" class="time">00-06s</text><text x="28" y="82" class="h">问题开场</text><text x="28" y="118" class="p">一本书会散落成 PDF、笔记、PPT、音视频、链接。</text><path d="M42 180 h126 v90 h-126z" fill="#fef3c7" rx="8"/><path d="M62 205 h86 M62 230 h74 M62 255 h96" stroke="#92400e" stroke-width="8" stroke-linecap="round"/></g>
  <g transform="translate(310 170)"><rect width="210" height="460" class="box"/><text x="28" y="45" class="time">06-16s</text><text x="28" y="82" class="h">技能接力</text><text x="28" y="118" class="p">source、notebook、prompt、Studio、QA、delivery 分层协作。</text><circle cx="62" cy="220" r="28" fill="#22d3ee"/><circle cx="108" cy="220" r="28" fill="#34d399"/><circle cx="154" cy="220" r="28" fill="#f59e0b"/><path d="M55 290 C95 340 128 245 170 315" stroke="#a5b4fc" stroke-width="6" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(550 170)"><rect width="210" height="460" class="box"/><text x="28" y="45" class="time">16-30s</text><text x="28" y="82" class="h">Notebook 核心</text><text x="28" y="118" class="p">等待 source ready，围绕同一 notebook 生成多种 artifact。</text><rect x="38" y="178" width="134" height="154" rx="16" fill="#0ea5e9" opacity=".85"/><path d="M66 218 h78 M66 250 h78 M66 282 h52" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>
  <g transform="translate(790 170)"><rect width="210" height="460" class="box"/><text x="28" y="45" class="time">30-42s</text><text x="28" y="82" class="h">审计与 QA</text><text x="28" y="118" class="p">把生成过程留成 prompt log、artifact ID、manifest 和验证记录。</text><rect x="45" y="185" width="120" height="140" rx="12" fill="#111827" stroke="#fbbf24"/><path d="M70 220 h70 M70 252 h52 M70 284 h82" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/><circle cx="160" cy="333" r="26" fill="#22c55e"/><path d="M148 333 l9 9 17-22" stroke="#fff" stroke-width="5" fill="none"/></g>
  <g transform="translate(1030 170)"><rect width="210" height="460" class="box"/><text x="28" y="45" class="time">42-54s</text><text x="28" y="82" class="h">交付分流</text><text x="28" y="118" class="p">原始大文件进 Drive，repo 只放压缩预览和说明。</text><path d="M105 175 L170 285 L40 285 Z" fill="#34d399" opacity=".9"/><rect x="52" y="330" width="106" height="70" rx="12" fill="#0f172a" stroke="#60a5fa"/><circle cx="76" cy="365" r="9" fill="#60a5fa"/><path d="M92 365 h42" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/></g>
  <g transform="translate(1270 170)"><rect width="100" height="460" class="box"/><text x="22" y="45" class="time">54-60s</text><text x="22" y="82" class="h">Demo</text><text x="22" y="118" class="p">一键浏览。</text><circle cx="50" cy="230" r="34" fill="#f472b6"/><path d="M35 230 h30 M50 215 v30" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
  <path d="M280 400 H310 M520 400 H550 M760 400 H790 M1000 400 H1030 M1240 400 H1270" stroke="#c7d2fe" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="70" y="710" class="sub">Remotion 使用建议：把每个 stage 做成一个 Sequence，资产复用本文 SVG、hero image、slide previews；生成 60s 横版视频和 15s 社媒短版。</text>
</svg>